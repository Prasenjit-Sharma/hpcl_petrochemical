<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" role="img" aria-label="HP Durapol - Perfect Bonding (placeholder)">
  <!-- textLength + lengthAdjust keep the wordmark inside the canvas even when
       this SVG is loaded via <img> and Montserrat is unavailable. -->
  <text x="6" y="45" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="800"
        textLength="330" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#df1a14">HP</tspan><tspan fill="#ffffff"> DURA</tspan><tspan fill="#1aa7dd">POL&#174;</tspan>
  </text>
  <text x="8" y="71" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700"
        fill="#cfe0f0" textLength="250" lengthAdjust="spacingAndGlyphs">PERFECT BONDING</text>
</svg>
