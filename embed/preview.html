<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HP Petrochemicals - embed preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="mount"></div>
  <script>
    /* Inject only the embeddable block, exactly as it would sit inside the
       live page's content area - no surrounding chrome. */
    fetch("./hp-petrochemicals.html?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var mount = document.getElementById("mount");
        mount.innerHTML = html;
        mount.querySelectorAll("script").forEach(function (old) {
          var s = document.createElement("script");
          if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
          old.replaceWith(s);
        });
      });
  </script>
</body>
</html>
